<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>stretch 测试</title>
<link rel="stylesheet" href="../layout.css">
<style>
body { padding: 20px; font-family: sans-serif; font-size: 14px; }
h1 { border-bottom: 2px solid #333; }
h2 { margin-top: 30px; color: #555; border-bottom: 1px solid #999; }
#verify-summary { position: sticky; top: 0; z-index: 100; padding: 8px 16px; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
.section { margin: 12px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.case { border: 1px solid #999; padding: 7px; background: #fafafa; }
.case-num { color: #ff6b6b; font-weight: bold; }
.case-class { font-family: monospace; font-size: 12px; }
.case-expect { font-family: monospace; font-size: 11px; color: #2e7d32; }
.case.pass { background: #e8f5e9; border-color: #4caf50; }
.case.fail { background: #ffebee; border-color: #f44336; }
.container { border: 3px solid #333; background: #f0f0f0; }

:where(.ctrl) { justify-items: start; align-items: start; }
.grid-box { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 200px; height: 200px; }
.grid-box .item { background: #a5d6a7; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #333; }

.flex-box { display: flex; width: 200px; height: 200px; align-items: start; }
.flex-box .item { background: #a5d6a7; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #333; }

/* stretch 规则已迁至 layout.css */
</style>
</head>
<body>

<h1>Grid stretch</h1>
<p>对照：ji:start ai:start</p>
<div class="section">
    <div class="case"><div class="case-num">C</div><div class="case-class">对照</div><div class="container grid grid-box ctrl"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div></div></div>
</div>

<script>
var num=0;
function cls(s){return s?' '+s.replace(/\./g,' '):'';}

var contents=['','content-Z','content-S','content-N','content-И'];
var cnames={ '':'Z(默认)','content-Z':'Z','content-S':'S','content-N':'N','content-И':'И' };

// Grid 期望：根据 content 返回要检查的属性
function gridXExpect(co){
  return co==='content-N'||co==='content-И' ? 'ai' : 'ji';
}
function gridYExpect(co){
  return co==='content-N'||co==='content-И' ? 'ji' : 'ai';
}

function makeGrid(title, clsName, getExp){
  document.write('<h2>'+title+'</h2><div class="section">');
  for(var ci=0;ci<contents.length;ci++){
    var co=contents[ci];
    var exp=getExp(co);
    num++; document.write('<div class="case" data-exp="'+exp+'"><div class="case-num">'+num+'</div><div class="case-class">同 '+cnames[co]+'</div><div class="case-expect">'+exp+'</div><div class="container grid grid-box ctrl'+cls(co)+' '+clsName+'"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div></div></div>');
    num++; var w=co?'<div class="'+co+'">':'<div>';
    document.write('<div class="case" data-exp="'+exp+'"><div class="case-num">'+num+'</div><div class="case-class">上 '+cnames[co]+'</div><div class="case-expect">'+exp+'</div>'+w+'<div class="container grid grid-box ctrl '+clsName+'"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div></div></div></div>');
  }
  document.write('</div>');
}
makeGrid('items-x-stretch','items-x-stretch',gridXExpect);
makeGrid('items-y-stretch','items-y-stretch',gridYExpect);
makeGrid('items-stretch','items-stretch',function(){return 'ji+ai';});
</script>

<h1>Flex stretch</h1>

<script>
var gos=['','go-x','go-y'];
var goname={ '':'默认','go-x':'.go-x','go-y':'.go-y' };

function makeFlex(title, clsName, getMech){
  document.write('<h2>'+title+'</h2><div class="section">');
  for(var ci=0;ci<contents.length;ci++){
    var co=contents[ci];
    for(var gi=0;gi<gos.length;gi++){
      var go=gos[gi];
      var mech=getMech(co,go);
      num++; document.write('<div class="case" data-exp="'+mech+'"><div class="case-num">'+num+'</div><div class="case-class">同 '+cnames[co]+' '+goname[go]+'</div><div class="case-expect">'+mech+'</div><div class="container flex flex-box'+cls(co)+' '+cls(go)+' '+clsName+'"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div></div>');
      num++; var w=co?'<div class="'+co+'">':'<div>';
      document.write('<div class="case" data-exp="'+mech+'"><div class="case-num">'+num+'</div><div class="case-class">上 '+cnames[co]+' 子'+goname[go]+'</div><div class="case-expect">'+mech+'</div>'+w+'<div class="container flex flex-box '+cls(go)+' '+clsName+'"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div></div></div>');
    }
  }
  document.write('</div>');
}

function fxMech(co,go){
  if(co==='content-N'||co==='content-И') return go!=='go-x' ? 'ai:stretch' : 'flex:1';
  return go==='go-y' ? 'ai:stretch' : 'flex:1';
}
makeFlex('items-x-stretch','items-x-stretch',fxMech);

function fyMech(co,go){
  if(co==='content-N'||co==='content-И') return go==='go-x' ? 'ai:stretch' : 'flex:1';
  return go!=='go-y' ? 'ai:stretch' : 'flex:1';
}
makeFlex('items-y-stretch','items-y-stretch',fyMech);

function fsMech(co,go){ return 'ai + flex:1'; }
makeFlex('items-stretch','items-stretch',fsMech);
</script>

<h1>Flex stretch 换行</h1>

<script>
function wrapDim(co,go){
  if(co==='content-N'||co==='content-И'){
    return go==='go-x' ? 'width:90px;flex-wrap:wrap' : 'height:90px;flex-wrap:wrap';
  }
  return go==='go-y' ? 'height:90px;flex-wrap:wrap' : 'width:90px;flex-wrap:wrap';
}

function makeFlexWrap(title, clsName, getMech){
  document.write('<h2>'+title+'</h2><div class="section">');
  for(var ci=0;ci<contents.length;ci++){
    var co=contents[ci];
    for(var gi=0;gi<gos.length;gi++){
      var go=gos[gi];
      var mech=getMech(co,go);
      var style=wrapDim(co,go);
      num++; document.write('<div class="case" data-exp="'+mech+'"><div class="case-num">'+num+'</div><div class="case-class">同 '+cnames[co]+' '+goname[go]+'</div><div class="case-expect">'+mech+' 换行</div><div class="container flex flex-box'+cls(co)+' '+cls(go)+' '+clsName+'" style="'+style+'"><div class="item" style="min-width:40px;min-height:40px">1</div><div class="item" style="min-width:40px;min-height:40px">2</div><div class="item" style="min-width:40px;min-height:40px">3</div><div class="item" style="min-width:40px;min-height:40px">4</div><div class="item" style="min-width:40px;min-height:40px">5</div></div></div>');
      num++; var w=co?'<div class="'+co+'">':'<div>';
      document.write('<div class="case" data-exp="'+mech+'"><div class="case-num">'+num+'</div><div class="case-class">上 '+cnames[co]+' 子'+goname[go]+'</div><div class="case-expect">'+mech+' 换行</div>'+w+'<div class="container flex flex-box '+cls(go)+' '+clsName+'" style="'+style+'"><div class="item" style="min-width:40px;min-height:40px">1</div><div class="item" style="min-width:40px;min-height:40px">2</div><div class="item" style="min-width:40px;min-height:40px">3</div><div class="item" style="min-width:40px;min-height:40px">4</div><div class="item" style="min-width:40px;min-height:40px">5</div></div></div></div>');
    }
  }
  document.write('</div>');
}
makeFlexWrap('items-x-stretch','items-x-stretch',fxMech);
makeFlexWrap('items-y-stretch','items-y-stretch',fyMech);
makeFlexWrap('items-stretch','items-stretch',fsMech);
</script>

<script>
(function(){
    var fail=0, total=0;
    document.querySelectorAll('.case').forEach(function(c){
        var n=c.querySelector('.case-num').textContent;
        var ct=c.querySelector('.container');
        if(!ct)return;
        var exp=c.getAttribute('data-exp')||'';
        var s=getComputedStyle(ct);
        var ji=s.justifyItems, ai=s.alignItems;

        var checkJi=exp.indexOf('ji')!==-1, checkAi=exp.indexOf('ai')!==-1;
        var jiOK=!checkJi||ji==='stretch';
        var aiOK=!checkAi||ai==='stretch';

        // flex:1 检查子项的 flex 属性
        var checkFlex=exp.indexOf('flex:1')!==-1||exp.indexOf('flex: 1')!==-1;
        var flexOK=true;
        if(checkFlex){
            var first=c.querySelector('.item');
            if(first){ var f=getComputedStyle(first).flex; flexOK=f.indexOf('1')===0||f.indexOf('1 1')===0; }
        }

        var allOK=jiOK&&aiOK&&flexOK;
        if(!allOK) fail++;
        c.classList.add(allOK?'pass':'fail');
        total++;

    });
    var summary = document.createElement('div');
    summary.id = 'verify-summary';
    summary.style.cssText = 'position:sticky;top:0;z-index:100;padding:8px 16px;font-size:14px;font-weight:bold;margin-bottom:10px;';
    var allPass = fail === 0;
    summary.style.background = allPass ? '#e8f5e9' : '#ffebee';
    summary.style.color = allPass ? '#2e7d32' : '#c62828';
    summary.textContent = (total-fail) + ' 通过 / ' + fail + ' 失败 / ' + total + ' 总计' + (allPass ? ' ✓' : ' ✗');
    document.body.insertBefore(summary, document.body.firstChild);
})();
</script>
</body>
</html>
