<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>书写模式类测试</title>
    <link rel="stylesheet" href="../css/layout.css">
    <style>
        body { padding: 20px; font-family: sans-serif; }
        h2 { margin-top: 40px; border-bottom: 2px solid #333; }
        .section { margin: 20px 0; padding: 10px; border: 1px dashed #999; }

        .box {
            width: 60px;
            height: 60px;
            background: #a5d6a7;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .container {
            border: 2px solid #333;
            min-height: 150px;
            min-width: 300px;
            background: #f5f5f5;
            padding: 10px;
        }

        .label { font-size: 12px; color: #666; margin-bottom: 5px; }
        .code { font-family: monospace; background: #e8e8e8; padding: 2px 6px; border-radius: 3px; }
        .case-num { font-weight: bold; color: #ffab91; }
        .section.pass { background: #e8f5e9; border-color: #4caf50; }
        .section.fail { background: #ffebee; border-color: #f44336; }
        #verify-summary { position: sticky; top: 0; z-index: 100; padding: 8px 16px; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<h1>书写模式类 .content-Z/S/N/И</h1>

<div class="section">
    <p class="label"><span class="case-num">用例1</span> 默认（无 class）= 浏览器默认</p>
    <div class="container flex">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
</div>

<div class="section">
    <p class="label"><span class="case-num">用例2</span> <span class="code">.content-Z</span> = 现代横排</p>
    <div class="container content-Z flex">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
</div>

<div class="section">
    <p class="label"><span class="case-num">用例3</span> <span class="code">.content-S</span> = 阿拉伯语横排 rtl</p>
    <div class="container content-S flex">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
</div>

<div class="section">
    <p class="label"><span class="case-num">用例4</span> <span class="code">.content-N</span> = 传统中文竖排</p>
    <div class="container content-N flex" style="height: 200px;">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
</div>

<div class="section">
    <p class="label"><span class="case-num">用例5</span> <span class="code">.content-И</span> = 蒙古文竖排</p>
    <div class="container content-И flex" style="height: 200px;">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>
</div>

<script>
(function() {
  const expect = {
    '':         { writingMode: 'horizontal-tb', direction: 'ltr' },
    'content-Z': { writingMode: 'horizontal-tb', direction: 'ltr' },
    'content-S': { writingMode: 'horizontal-tb', direction: 'rtl' },
    'content-N': { writingMode: 'vertical-rl', direction: 'ltr' },
    'content-И': { writingMode: 'vertical-lr', direction: 'ltr' }
  };

  let pass = 0, fail = 0;

  for (const section of document.querySelectorAll('.section')) {
    const container = section.querySelector('.container');
    if (!container) continue;

    const cls = ['content-Z', 'content-S', 'content-N', 'content-И']
      .find(c => container.classList.contains(c)) || '';

    if (cls === undefined) continue;

    const style = getComputedStyle(container);
    const exp = expect[cls];
    const ok = style.writingMode === exp.writingMode && style.direction === exp.direction;

    section.classList.add(ok ? 'pass' : 'fail');
    if (ok) pass++; else fail++;
  }

  var summary = document.createElement('div');
  summary.id = 'verify-summary';
  var allPass = fail === 0;
  summary.style.background = allPass ? '#e8f5e9' : '#ffebee';
  summary.style.color = allPass ? '#2e7d32' : '#c62828';
  summary.textContent = pass + ' 通过 / ' + fail + ' 失败 / ' + (pass + fail) + ' 总计' + (allPass ? ' ✓' : ' ✗');
  document.body.insertBefore(summary, document.body.firstChild);
})();
</script>
</body>
</html>
