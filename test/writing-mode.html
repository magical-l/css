<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>layout.css 书写模式测试</title>
	<link rel="stylesheet" href="../css/layout.css">
	<style>
		body {
			padding: 20px;
			font-family: sans-serif;
			font-size: 14px;
		}

		h1 {
			border-bottom: 2px solid #333;
		}

		h2 {
			margin-top: 30px;
			color: #555;
			border-bottom: 1px solid #999;
		}

		#summary {
			position: sticky;
			top: 0;
			z-index: 100;
			padding: 8px 16px;
			font-size: 14px;
			font-weight: bold;
			margin-bottom: 10px;
		}

		.section {
			margin: 15px 0;
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
			align-items: flex-start;
		}

		.case {
			border: 1px solid #999;
			padding: 8px;
			background: #fafafa;
			font-size: 11px;
		}

		.case.pass {
			background: #e8f5e9;
			border-color: #4caf50;
		}

		.case.fail {
			background: #ffebee;
			border-color: #f44336;
		}

		.case .label {
			font-weight: bold;
			margin-bottom: 2px;
		}

		.case .classes {
			font-family: monospace;
			color: #555;
			margin-bottom: 4px;
			font-size: 10px;
		}

		.case .actual {
			font-family: monospace;
			color: #c62828;
			display: none;
			font-size: 10px;
		}

		.case.fail .actual {
			display: block;
		}

		.container {
			border: 2px solid #333;
			background: #f5f5f5;
		}

		.item {
			background: #a5d6a7;
			border: 1px solid #333;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: bold;
			color: #333;
		}

		.container.grid {
			grid-template-columns: 60px 60px 60px;
			grid-template-rows: 45px 45px;
			width: 200px;
			height: 110px;
			gap: 0;
		}

		.container.grid .item {
			width: 35px;
			height: 22px;
		}

		.container.flex {
			width: 200px;
			min-height: 90px;
			gap: 0;
		}

		.container.flex .item {
			width: 40px;
			height: 28px;
		}

		/* 竖排容器尺寸 */
		.container.grid.content-N, .container.grid.content-И {
			width: 110px;
			height: 200px;
		}

		.container.flex.content-N, .container.flex.content-И {
			width: 80px;
			min-height: 200px;
		}

	</style>
</head>
<body>
	<h1>layout.css 书写模式测试</h1>
	<div id="summary"></div>
	<script>
		function verify() {
			let pass = 0,
				fail = 0;
			document.querySelectorAll('.case').forEach(c => {
				const expectStr = c.dataset.expect || '';
				const expect = {};
				expectStr.split(/\s+/).filter(Boolean).forEach(pair => {
					const [prop, val] = pair.split(':');
					if (prop && val) expect[prop] = val;
				});
				const target = c.querySelector(c.dataset.target || '.container');
				const cs = getComputedStyle(target);
				let ok = true,
					actuals = [];
				for (const [prop, val] of Object.entries(expect)) {
					const actual = cs[prop];
					if (actual !== val) {
						ok = false;
						actuals.push(prop + ':' + actual + '≠' + val);
					}
				}
				c.classList.add(ok ? 'pass' : 'fail');
				if (!ok) {
					const el = c.querySelector('.actual');
					if (el) el.textContent = actuals.join(' ');
				}
				if (ok) pass++;
				else fail++;
			});
			const s = document.getElementById('summary');
			const allPass = fail === 0;
			s.style.background = allPass ? '#e8f5e9' : '#ffebee';
			s.style.color = allPass ? '#2e7d32' : '#c62828';
			s.textContent = pass + ' 通过 / ' + fail + ' 失败 / ' + (pass + fail) + ' 总计' + (allPass ? ' ✓' : ' ✗');
		}
		// ========== 用例生成 ==========
		let caseId = 400;
		const allDists = ['items-near-left', 'items-near-right', 'items-near-top', 'items-near-bottom', 'items-x-stretch', 'items-y-stretch', 'items-stretch', 'items-x-near-center', 'items-y-near-center', 'items-near-center', 'items-x-space-between', 'items-y-space-between', 'items-space-between', 'items-x-space-evenly', 'items-y-space-evenly', 'items-space-evenly', 'items-x-space-around', 'items-y-space-around', 'items-space-around', ];
		const flexCombos = [
			['items-go-x', null],
			['items-go-x', 'items-from-right'],
			['items-go-y', null],
			['items-go-y', 'items-from-bottom'],
		];
		// ========== 期望值映射 ==========
		// content-Z: 同 layout.html
		function baseDistExpect(go, dist) {
			const y = go === 'items-go-y';
			const map = {
				'items-near-left': y ? 'align-content:start align-items:start' : 'justify-content:start justify-items:start',
				'items-near-right': y ? 'align-content:end align-items:end' : 'justify-content:end justify-items:end',
				'items-near-top': y ? 'justify-content:start justify-items:start' : 'align-content:start align-items:start',
				'items-near-bottom': y ? 'justify-content:end justify-items:end' : 'align-content:end align-items:end',
				'items-x-stretch': y ? 'align-content:stretch align-items:stretch' : 'justify-content:stretch justify-items:stretch',
				'items-y-stretch': y ? 'justify-content:stretch justify-items:stretch' : 'align-content:stretch align-items:stretch',
				'items-stretch': 'justify-content:stretch align-content:stretch justify-items:stretch align-items:stretch',
				'items-x-near-center': y ? 'align-content:center' : 'justify-content:center justify-items:center',
				'items-y-near-center': y ? 'justify-content:center' : 'align-content:center align-items:center',
				'items-near-center': 'justify-content:center align-content:center justify-items:center align-items:center',
				'items-x-space-between': y ? 'align-content:space-between' : 'justify-content:space-between',
				'items-y-space-between': y ? 'justify-content:space-between' : 'align-content:space-between',
				'items-space-between': 'justify-content:space-between align-content:space-between',
				'items-x-space-evenly': y ? 'align-content:space-evenly' : 'justify-content:space-evenly',
				'items-y-space-evenly': y ? 'justify-content:space-evenly' : 'align-content:space-evenly',
				'items-space-evenly': 'justify-content:space-evenly align-content:space-evenly',
				'items-x-space-around': y ? 'align-content:space-around' : 'justify-content:space-around',
				'items-y-space-around': y ? 'justify-content:space-around' : 'align-content:space-around',
				'items-space-around': 'justify-content:space-around align-content:space-around',
			};
			return map[dist] || '';
		}
		// content-S 的 near-left/right 翻转仅对 grid 生效（&.grid, & .grid 内），且不翻转 go-y 下的 align-*
		// 对于 grid 容器，在调用处单独处理
		function sDistExpect(go, dist) {
			return baseDistExpect(go, dist);
		}
		// content-N (vertical-rl): 竖排轴交换
		function nDistExpect(go, dist) {
			const y = go === 'items-go-y';
			const map = {
				'items-near-left': 'align-content:end align-items:end',
				'items-near-right': 'align-content:start align-items:start',
				'items-near-top': y ? 'align-content:start align-items:start' : 'justify-content:start justify-items:start',
				'items-near-bottom': y ? 'align-content:end align-items:end' : 'justify-content:end justify-items:end',
				'items-x-stretch': y ? 'justify-content:stretch justify-items:stretch' : 'align-content:stretch align-items:stretch',
				'items-y-stretch': y ? 'align-content:stretch align-items:stretch' : 'justify-content:stretch justify-items:stretch',
				'items-stretch': 'justify-content:stretch align-content:stretch justify-items:stretch align-items:stretch',
				'items-x-near-center': y ? 'justify-content:center' : 'align-content:center',
				'items-y-near-center': y ? 'align-content:center' : 'justify-content:center',
				'items-near-center': 'justify-content:center align-content:center justify-items:center align-items:center',
				'items-x-space-between': y ? 'justify-content:space-between' : 'align-content:space-between',
				'items-y-space-between': y ? 'align-content:space-between' : 'justify-content:space-between',
				'items-space-between': 'justify-content:space-between align-content:space-between',
				'items-x-space-evenly': y ? 'justify-content:space-evenly' : 'align-content:space-evenly',
				'items-y-space-evenly': y ? 'align-content:space-evenly' : 'justify-content:space-evenly',
				'items-space-evenly': 'justify-content:space-evenly align-content:space-evenly',
				'items-x-space-around': y ? 'justify-content:space-around' : 'align-content:space-around',
				'items-y-space-around': y ? 'align-content:space-around' : 'justify-content:space-around',
				'items-space-around': 'justify-content:space-around align-content:space-around',
			};
			return map[dist] || '';
		}
		// content-И (vertical-lr): 同 N 但 left/right 方向相反
		function iDistExpect(go, dist) {
			const y = go === 'items-go-y';
			const map = {
				'items-near-left': y ? 'justify-content:start justify-items:start' : 'align-content:start align-items:start',
				'items-near-right': y ? 'justify-content:end justify-items:end' : 'align-content:end align-items:end',
				'items-near-top': y ? 'align-content:start align-items:start' : 'justify-content:start justify-items:start',
				'items-near-bottom': y ? 'align-content:end align-items:end' : 'justify-content:end justify-items:end',
				'items-x-stretch': y ? 'justify-content:stretch justify-items:stretch' : 'align-content:stretch align-items:stretch',
				'items-y-stretch': y ? 'align-content:stretch align-items:stretch' : 'justify-content:stretch justify-items:stretch',
				'items-stretch': 'justify-content:stretch align-content:stretch justify-items:stretch align-items:stretch',
				'items-x-near-center': y ? 'justify-content:center' : 'align-content:center',
				'items-y-near-center': y ? 'align-content:center' : 'justify-content:center',
				'items-near-center': 'justify-content:center align-content:center justify-items:center align-items:center',
				'items-x-space-between': y ? 'justify-content:space-between' : 'align-content:space-between',
				'items-y-space-between': y ? 'align-content:space-between' : 'justify-content:space-between',
				'items-space-between': 'justify-content:space-between align-content:space-between',
				'items-x-space-evenly': y ? 'justify-content:space-evenly' : 'align-content:space-evenly',
				'items-y-space-evenly': y ? 'align-content:space-evenly' : 'justify-content:space-evenly',
				'items-space-evenly': 'justify-content:space-evenly align-content:space-evenly',
				'items-x-space-around': y ? 'justify-content:space-around' : 'align-content:space-around',
				'items-y-space-around': y ? 'align-content:space-around' : 'justify-content:space-around',
				'items-space-around': 'justify-content:space-around align-content:space-around',
			};
			return map[dist] || '';
		}

		function gridFlowStr(go, mode) {
			return go === 'items-go-y' ? 'grid-auto-flow:column' : 'grid-auto-flow:row';
		}

		function flexDirStr(go, from, mode) {
			if (mode === 'N') {
				if (from === 'items-from-left') return 'flex-direction:column-reverse';
				if (from === 'items-from-right') return 'flex-direction:column';
				if (from === 'items-from-bottom') return 'flex-direction:row-reverse';
				return go === 'items-go-y' ? 'flex-direction:column' : 'flex-direction:row';
			}
			if (mode === 'И') {
				if (from === 'items-from-left') return 'flex-direction:column';
				if (from === 'items-from-right') return 'flex-direction:column-reverse';
				if (from === 'items-from-bottom') return 'flex-direction:row-reverse';
				return go === 'items-go-y' ? 'flex-direction:column' : 'flex-direction:row';
			}
			if (from === 'items-from-right') return mode === 'S' ? 'flex-direction:row' : 'flex-direction:row-reverse';
			if (from === 'items-from-bottom') return 'flex-direction:column-reverse';
			return go === 'items-go-y' ? 'flex-direction:column' : 'flex-direction:row';
		}
		// ========== 生成函数 ==========
		function appendCase(container, parentId, cls, itemCount, expect, label) {
			const div = document.createElement('div');
			div.className = 'case';
			div.dataset.id = caseId;
			div.dataset.expect = expect;
			div.innerHTML = '<div class="label">' + caseId + '. ' + label + '</div>' + '<div class="classes">' + cls + '</div>' + '<div class="container ' + cls + '">' + Array(itemCount).fill('<div class="item">X</div>').join('') + '</div><div class="actual"></div>';
			document.getElementById(parentId).appendChild(div);
			caseId++;
		}
		// ========== 遍历 4 种书写模式 ==========
		['Z', 'S', 'N', 'И'].forEach(mode => {
			const modeClass = 'content-' + mode;
			const parentId = 'cases-' + mode;
			document.write('<h2>content-' + mode + '</h2><div id="' + parentId + '" class="section"></div>');
			let getDist;
			if (mode === 'S') getDist = sDistExpect;
			else if (mode === 'N') getDist = nDistExpect;
			else if (mode === 'И') getDist = iDistExpect;
			else getDist = baseDistExpect;
			// Grid + go-x / go-y
			['items-go-x', 'items-go-y'].forEach(go => {
				allDists.forEach(dist => {
					const cls = ['grid', modeClass, go, dist].join(' ');
					const flow = gridFlowStr(go, mode);
					let distE = getDist(go, dist);
					if (mode === 'S' && go === 'items-go-x' && dist === 'items-near-left') distE = 'justify-content:end justify-items:end';
					if (mode === 'S' && go === 'items-go-x' && dist === 'items-near-right') distE = 'justify-content:start justify-items:start';
					appendCase(null, parentId, cls, 4, flow + ' ' + distE, cls);
				});
			});
			// Grid 无 go
			allDists.forEach(dist => {
				const cls = ['grid', modeClass, dist].join(' ');
				let distE = getDist('items-go-x', dist);
				if (mode === 'S' && dist === 'items-near-left') distE = 'justify-content:end justify-items:end';
				if (mode === 'S' && dist === 'items-near-right') distE = 'justify-content:start justify-items:start';
				appendCase(null, parentId, cls, 4, 'grid-auto-flow:row ' + distE, cls);
			});
			// Flex combos
			flexCombos.forEach(([go, from]) => {
				allDists.forEach(dist => {
					const parts = ['flex', modeClass, go];
					if (from) parts.push(from);
					parts.push(dist);
					const cls = parts.join(' ');
					let dir = flexDirStr(go, from, mode);
					let distE = baseDistExpect(go, dist);
					// from-* 反转：对所有书写模式生效
					if (from === 'items-from-right') {
						if (dist === 'items-near-left') distE = 'justify-content:end justify-items:end';
						if (dist === 'items-near-right') distE = 'justify-content:start justify-items:start';
					}
					if (from === 'items-from-bottom') {
						if (dist === 'items-near-top') distE = 'justify-content:end justify-items:end';
						if (dist === 'items-near-bottom') distE = 'justify-content:start justify-items:start';
					}
					appendCase(null, parentId, cls, 3, dir + ' ' + distE, cls);
				});
			});
			// Flex 无 go
			allDists.forEach(dist => {
				const cls = ['flex', modeClass, dist].join(' ');
				appendCase(null, parentId, cls, 3, 'flex-direction:row ' + baseDistExpect('items-go-x', dist), cls);
			});
		});
		window.addEventListener('DOMContentLoaded', () => setTimeout(verify, 200));

	</script>
</body>
</html>
